[workspace]
members = ["crates/harbor-core", "crates/harbor-themes", "crates/harbor-desktop", "crates/harbor-tui"]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
harbor-core = { path = "crates/harbor-core" }
harbor-themes = { path = "crates/harbor-themes" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "mysql"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
thiserror = "=2.0.12"
zeroize = "=1.8.1"
sha1 = "=0.10.7"
fs2 = "=0.4.3"
zip = { version = "=2.4.2", default-features = false, features = ["deflate", "aes-crypto"] }
sha2 = "=0.10.9"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
libc = "=0.2.191"
keyring = { version = "=3.6.2", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "=0.31.1", default-features = false }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
signal-hook = "=0.3.17"

[profile.release]
lto = "thin"
strip = true

